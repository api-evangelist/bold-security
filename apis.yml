aid: bold-security
name: Bold Security
description: 'Bold Security provides real-time, on-device (endpoint) data security. Its
  on-device AI classifies data interactions across every application in real time and
  detects and prevents user- and AI-agent-driven data exfiltration before sensitive data
  leaves the endpoint, without requiring policy configuration or cloud round-trips. The
  platform gives security teams visibility into data movement, intent and risky-behavior
  analysis, and full-context investigation across employees and AI agents. Bold Security
  is ISO 27001 certified and SOC 2 compliant, and is a portfolio company of Bessemer
  Venture Partners. As of this profile the company publishes no public developer API,
  specification, or SDK; this entry captures its identity, security posture, and public
  properties.'
